name: Playwright + Cucumber Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          set -x
          npm run test:bdd 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        env:
          ENV: qa
          URL: ${{ secrets.URL }}
          usuario: ${{ secrets.USUARIO }}
          pass: ${{ secrets.PASS }}

      - name: Show test output
        if: always()
        run: cat test-output.txt